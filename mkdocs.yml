site_name: VapourSynth AI Video Guide
site_description: Straightforward Windows installation and workflow guide for VapourSynth R80+, NVIDIA TensorRT, MLRT, and ONNX AI models.
site_url: https://yuui03e.github.io/vapoursynth-ai-video-installation-guide/
repo_url: https://github.com/Yuui03E/vapoursynth-ai-video-installation-guide
repo_name: Yuui03E/vapoursynth-ai-video-installation-guide
edit_uri: edit/dev/docs/
docs_dir: docs
site_dir: site

theme:
  variant: modern
  logo: assets/vapoursynth-mark.svg
  favicon: assets/favicon.svg
  font:
    text: Space Grotesk
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: lucide/sun
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: lucide/moon
        name: Switch to dark mode

nav:
  - Quick Start Guide: index.md
  - Step-by-Step Installation:
      - Windows Setup: installation/windows.md
      - Verification Checklist: installation/verification.md
  - AI Models & Runtimes:
      - Models & Directory Setup: models/index.md
      - AnimeJaNai (Upscaling): models/animejanai.md
      - RIFE (Frame Interpolation): models/rife.md
      - Waifu2x (Upscale & Denoise): models/waifu2x.md
  - Complete Scripts & Workflows:
      - Ready-to-Use Scripts (test.vpy): examples/index.md
      - Preview & Render (vsview & vspipe): workflows/preview-and-render.md
  - Troubleshooting: troubleshooting/index.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/anime-art.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
